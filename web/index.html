<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f8f9f5">
  <meta name="description" content="AquaLens uses satellite observations to explore lake conditions, evidence, and forecast accuracy.">
  <title>AquaLens — Freshwater monitoring</title>
  <link rel="icon" type="image/svg+xml" href="station/mark.svg">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="station/workspace.css">
  <link rel="stylesheet" href="station/quality.css">
  <link rel="stylesheet" href="station/geography.css">
  <link rel="stylesheet" href="station/outlook.css">
  <link rel="stylesheet" href="station/forecast-finish.css">
  <link rel="stylesheet" href="station/accuracy-finish.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to content</a>
  <header class="site-head">
    <div class="site-bar">
      <a class="site-brand" href="#assessment" aria-label="AquaLens home">
        <img src="station/mark.svg" width="36" height="36" alt="">
        <span><strong>AquaLens</strong><small>FRESHWATER MONITORING</small></span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#assessment" data-route="assessment">Monitor</a>
        <a href="#map" data-route="map">Map</a>
        <a href="#forecasts" data-route="forecasts">Forecast</a>
        <a href="#validation" data-route="validation">Accuracy</a>
        <a href="#evidence" data-route="evidence">Sources</a>
        <a href="#data" data-route="data">Data</a>
      </nav>
      <button type="button" class="station-button primary header-upload" data-upload><span data-symbol="upload"></span><span>Upload CSV</span></button>
    </div>
  </header>
  <div class="workspace-meta">
    <div>
      <span class="workspace-dataset"><span data-symbol="database"></span><strong id="dataset-label">Lake observations</strong></span>
      <span id="dataset-period" class="workspace-period">Preparing dataset</span>
    </div>
    <span id="workspace-status" class="workspace-status">Loading</span>
  </div>
  <main id="workspace" class="workspace" tabindex="-1">
    <div id="route-content"><section class="station-loading" aria-live="polite"><span class="spinner"></span><h1>Opening your workspace</h1><p>Loading observations and evidence.</p></section></div>
  </main>
  <footer class="site-foot"><a class="site-foot-brand" href="#assessment">AquaLens</a><span>Satellite observations · Research prototype</span><a href="#data">Dataset details</a></footer>
  <input type="file" id="upload-file" accept=".csv,text/csv" hidden>
  <input type="file" id="source-file" accept=".json,application/json" hidden>
  <div id="notification" class="station-toast" role="status" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="station/main.js"></script>
</body>
</html>
